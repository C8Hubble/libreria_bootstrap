<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/ini_sesion.css">
    <title>Iniciar Sesión | Administración</title>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="col-md-5  mt-5">
            <form action="#" method="get" id="form-login" onsubmit="return validarLoginA()" novalidate class="needs-validation"
                class=" pb-2 border border-3 rounded-4 shadow">
                <fieldset class="border-top border-primary  border-5 rounded d-flex flex-column align-items-center">
                    <div class="d-flex flex-column align-items-center mb-3">
                        <img src="../img/Icon_ini.jpg" alt=""
                            class="mt-5 mb-2 border-warning rounded border-2 border icono">
                        <span class="display-6 fw-bold">Administración</span>
                        <p class="subtexto mt-2">Panel de gestión y control bibliotecario • BiblioWeb</p>
                    </div>
                    <div class="alert alert-info d-flex rounded-4 " role="alert">
                        <i class="bi bi-info-circle mx-3"></i>
                        <div>
                            <p>Cuenta de prueba:</p>
                            <p>Correo: <strong>admin@biblioweb.test</strong><br>
                                Contraseña: <strong>Admin123</strong>
                            </p>
                        </div>
                    </div>
                    <div class="w-100 px-5"> <!----- inputs del formulario de ingreso ------>
                        <div class="mb-1">
                            <label for="usuario" class="form-label mt-4 fw-bold ">
                                <i class="bi bi-envelope mx-3"></i>Correo institucional
                                <span class="text-danger mx-1">*</span></label>
                            <input type="email" id="usuario" name="usuario" placeholder=" admin@biblioweb.test"
                                class="form-control text-primary w-100 mb-3 py-3" required>
                            <div class="invalid-feedback">
                                Por favor ingresa un corro valido @
                            </div>
                        </div>
                        <div class="mb-1">
                            <label for="clave" class="form-label fw-bold ">
                                <i class="bi bi-lock-fill mx-3"></i>Contraseña
                                <span class="text-danger mx-1">*</span>
                            </label>
                            <input type="password" id="clave" name="clave" class="form-control w-100 mb-3 text-primary py-3"
                                required placeholder="**********">
                            <div class="invalid-feedback">
                                Por favor ingresa el password
                            </div>
                        </div>
                        <!----- boton de ingreso ------>
                        <button type="submit" onclick="validarLoginA()" id="ingreso"
                            class="btn text-white rounded px-3 py-2 w-100 ">
                            <i class="bi bi-box-arrow-in-right mx-2"></i>
                            Ingresar al Panel
                        </button>
                    </div>
                    <div class="my-3">
                        <a href="../index.html" class="btn fw-bold mt-3 text-warning">
                            <i class="bi bi-arrow-left mx-1 text-warning"></i>
                            Volver al inicio público de la biblioteca
                        </a>
                    </div>

                </fieldset>

            </form>

        </div>

    </div>
    <script src="../js/sesion.js"></script>
    <script src="../js/ini_sesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



</body>

</html>
